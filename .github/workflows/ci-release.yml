name: Build, check and release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./Scripts/check.sh
      - run: ./Scripts/check-login.sh
      - run: ./Scripts/build.sh
      - run: ./Scripts/package-release.sh
      - name: Verify archive
        run: |
          archive=$(find dist -name '*.zip' -print -quit)
          (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
          ditto -x -k "$archive" "$RUNNER_TEMP/verify"
          codesign --verify --strict "$RUNNER_TEMP/verify/$(basename "$archive" .zip)/thermal kun.app"
      - uses: actions/upload-artifact@v4
        with:
          name: thermal-macos
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thermal-macos
          path: dist
      - name: Publish only a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import plistlib; print(plistlib.load(open('Packaging/Info.plist', 'rb'))['CFBundleShortVersionString'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then exit 0; fi
            gh release upload "$tag" dist/*
            gh release edit "$tag" --draft=false --target "$GITHUB_SHA" --title "thermal kun $version — Login startup" --notes-file "docs/release-notes-$tag.md" --latest
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "thermal kun $version — Login startup" --notes-file "docs/release-notes-$tag.md" --latest
          fi
